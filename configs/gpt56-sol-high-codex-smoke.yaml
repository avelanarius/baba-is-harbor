job_name: gpt56-sol-high-codex-smoke
jobs_dir: jobs
n_attempts: 1

orchestrator:
  n_concurrent_trials: 1

datasets:
  - path: tasks
    task_names: ["stage-00-level-00"]

agents:
  - import_path: openrouter_codex:OpenRouterCodex
    model_name: openai/gpt-5.6-sol
    override_timeout_sec: 3600
    kwargs:
      reasoning_effort: high
